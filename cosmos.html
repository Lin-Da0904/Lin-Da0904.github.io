<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestro Universo 💜</title>
    <!-- Mantiene el candado de sesión de tu página -->
    <script src="js/sesion.js"></script>
    <style>
        body {
            margin: 0;
            padding: 24px 16px;
            background: #06030e;
            color: #f3e8ff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .nav-top {
            width: 100%;
            max-width: 780px;
            margin-bottom: 16px;
        }

        .nav-top a {
            color: #d8b4fe;
            text-decoration: none;
            font-size: 0.95rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 8px;
            text-align: center;
        }

        p {
            color: #c4b5fd;
            margin: 0 0 20px;
            text-align: center;
            font-size: 0.95rem;
        }

        .controles {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid #a855f7;
            color: #f3e8ff;
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover,
        button.activo {
            background: #9333ea;
        }

        .lienzo-box {
            width: 100%;
            max-width: 780px;
            margin-bottom: 24px;
        }

        .oculto {
            display: none;
        }
    </style>
</head>

<body>
    <div class="nav-top">
        <a href="index.html">← Volver a nuestras citas</a>
    </div>

    <h1>Nuestro pedacito de universo 💜</h1>
    <p>Elige qué quieres ver o míralos juntos</p>

    <div class="controles">
        <button id="btn-corazon" type="button" class="activo">Corazón morado 💜</button>
        <button id="btn-galaxia" type="button">Galaxia en espiral 🌌</button>
        <button id="btn-ambos" type="button">Ver ambos ✨</button>
    </div>

    <div id="box-corazon" class="lienzo-box">
        <canvas id="canvas-corazon"></canvas>
    </div>

    <div id="box-galaxia" class="lienzo-box oculto">
        <canvas id="canvas-galaxia"></canvas>
    </div>

    <script src="js/corazon.js?v=3"></script>
    <script src="js/galaxia.js?v=3"></script>
    <script>
        (function () {
            var boxC = document.getElementById("box-corazon");
            var boxG = document.getElementById("box-galaxia");
            var btnC = document.getElementById("btn-corazon");
            var btnG = document.getElementById("btn-galaxia");
            var btnA = document.getElementById("btn-ambos");

            function mostrar(modo) {
                btnC.classList.remove("activo");
                btnG.classList.remove("activo");
                btnA.classList.remove("activo");

                if (modo === "corazon") {
                    boxC.classList.remove("oculto");
                    boxG.classList.add("oculto");
                    btnC.classList.add("activo");
                    if (typeof window.dibujarCorazonMorado === "function") {
                        window.dibujarCorazonMorado("canvas-corazon");
                    }
                } else if (modo === "galaxia") {
                    boxC.classList.add("oculto");
                    boxG.classList.remove("oculto");
                    btnG.classList.add("activo");
                    if (typeof window.dibujarGalaxia === "function") {
                        window.dibujarGalaxia("canvas-galaxia");
                    }
                } else {
                    boxC.classList.remove("oculto");
                    boxG.classList.remove("oculto");
                    btnA.classList.add("activo");
                    if (typeof window.dibujarCorazonMorado === "function") {
                        window.dibujarCorazonMorado("canvas-corazon");
                    }
                    if (typeof window.dibujarGalaxia === "function") {
                        window.dibujarGalaxia("canvas-galaxia");
                    }
                }
            }

            btnC.addEventListener("click", function () { mostrar("corazon"); });
            btnG.addEventListener("click", function () { mostrar("galaxia"); });
            btnA.addEventListener("click", function () { mostrar("ambos"); });

            var params = new URLSearchParams(window.location.search);
            var vistaInicial = params.get("ver") || "corazon";
            mostrar(vistaInicial);
        })();
    </script>
</body>

</html>
